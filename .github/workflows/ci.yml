name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test
      - name: swift build (release)
        run: swift build -c release

  packaging-smoke:
    # Structure-only: packages an UNSIGNED app bundle and checks its layout
    # and Info.plist metadata. No Apple credentials involved or required.
    # The signed/notarized artifact users install is produced only by the
    # tag-only .github/workflows/release.yml.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift build -c release
        run: swift build -c release
      - name: Package unsigned app bundle
        run: scripts/package-app.sh --version 0.0.0 --skip-build --output-dir dist
      - name: Smoke test bundle structure
        run: scripts/smoke-app-bundle.sh dist/Pinchos.app 0.0.0
