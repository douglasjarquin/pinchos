name: Export source for refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Remove Git metadata
        run: rm -rf .git

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pinchos-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
