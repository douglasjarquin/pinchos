name: Apply v0.1 refactor bundle

on:
  push:
    branches:
      - codex/v0.1-config-simplification

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v5
        with:
          ref: codex/v0.1-config-simplification
          fetch-depth: 0

      - name: Restore refactor tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-bundle/part-* | base64 --decode | tar -xz
          while IFS= read -r path; do
            rm -rf -- "$path"
          done < .refactor/delete.txt
          rm -rf .refactor .github/refactor-bundle .github/workflows/export-source.yml

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v0.1): simplify config and remove deferred features"
          git push origin HEAD:codex/v0.1-config-simplification
