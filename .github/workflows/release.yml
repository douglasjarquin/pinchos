name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Require arm64
        run: test "$(uname -m)" = arm64
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Package unsigned app
        run: scripts/package-app.sh --version "${{ steps.version.outputs.version }}" --output-dir dist --skip-build
      - name: Smoke test bundle
        run: scripts/smoke-app-bundle.sh dist/Pinchos.app "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pinchos-app-unsigned
          path: dist/Pinchos.app
          retention-days: 1

  sign-notarize-publish:
    needs: build-test-package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require signing and notarization credentials
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_DEVELOPER_ID_CERTIFICATE_P12 APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || { echo "error: missing $name; refusing to publish unsigned artifacts" >&2; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: pinchos-app-unsigned
          path: dist
      - name: Import signing identity
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import-signing-identity.sh
      - name: Sign app
        run: scripts/ci/codesign-app.sh dist/Pinchos.app
      - name: Submit app for notarization
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          ditto -c -k --keepParent dist/Pinchos.app dist/Pinchos-notarize.zip
          scripts/ci/notarize.sh dist/Pinchos-notarize.zip
      - name: Staple and verify
        run: |
          xcrun stapler staple dist/Pinchos.app
          xcrun stapler validate dist/Pinchos.app
          spctl --assess --type execute --verbose=4 dist/Pinchos.app
          codesign --verify --deep --strict --verbose=2 dist/Pinchos.app
      - name: Build final artifact and checksum
        run: |
          artifact="Pinchos-${{ needs.build-test-package.outputs.version }}-macos-arm64.zip"
          ditto -c -k --keepParent dist/Pinchos.app "dist/$artifact"
          shasum -a 256 "dist/$artifact" > "dist/$artifact.sha256"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-list -n 1 "$tag")"
          [[ "$commit" = "$tagged_commit" ]] || { echo "error: tag moved during release" >&2; exit 1; }
          if gh release view "$tag" --json body >/tmp/pinchos-release.json 2>/dev/null; then
            existing_commit="$(jq -r '.body' /tmp/pinchos-release.json | sed -n 's/^Release commit: //p' | head -1)"
            [[ "$existing_commit" = "$commit" ]] || { echo "error: existing release provenance does not match this commit" >&2; exit 1; }
          else
            gh release create "$tag" --title "Pinchos $tag" --notes "Release commit: $commit"
          fi
          gh release upload "$tag" "dist/$ARTIFACT" "dist/$ARTIFACT.sha256"
