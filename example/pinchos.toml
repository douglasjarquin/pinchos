[item.codex]
run = "quota-axi codex --short"
interval = "5m"
timeout = "15s"
format = "{output}"
symbol = "terminal"

[[item.codex.menu]]
label = "Usage"
run = "quota-axi codex --usage"
cache = "5m"

[[item.codex.menu]]
label = "Pace"
value = "healthy"

[[item.codex.menu]]
label = "Refresh"
run = "quota-axi codex --usage"
cache = "5m"
action = "open https://chatgpt.com/codex"

[[item.codex.menu]]
label = "Open Codex"
action = "open https://chatgpt.com/codex"

[[item.codex.menu]]
separator = true
