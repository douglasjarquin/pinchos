# Recipe: locale
# Category: Time
#
# Purpose: show the LANG setting inherited by Pinchos commands.
# Dependencies: none beyond the macOS base system (`locale` and awk).
# Expected output: "en_US.UTF-8" or the configured locale.
# Limitations: Pinchos inherits the environment that launches it; changing
#   a shell profile does not change an already running process until restart.

[item.locale]
type = "command"
run = "locale | awk -F= '/^LANG=/{print $2}'"
interval = "30m"
format = "{output}"
