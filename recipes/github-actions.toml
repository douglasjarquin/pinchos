# Recipe: github-actions (optional third-party tool)
# Category: GitHub
#
# Purpose: show the conclusion or live status of the latest GitHub Actions run.
# Dependencies: the GitHub CLI (`gh`), install from https://cli.github.com/.
# Expected output: "success", "failure", or a live status such as "queued".
# Limitations: this reads only the newest run in the current repository
#   context; add `--repo owner/name` for a fixed repository and note that a
#   repository with no runs returns an empty result.

[item.github_actions]

run = "gh run list --limit 1 --json conclusion,status --jq '.[0] | if .status == \"completed\" then .conclusion else .status end'"
interval = "2m"
timeout = "15s"
format = "CI {output}"
