# Recipe: memory-pressure
# Category: System
#
# Purpose: show a rough used-memory percentage from macOS VM page counts.
# Dependencies: none beyond the macOS base system (/usr/bin/vm_stat and awk).
# Expected output: "72"; it changes with the apps and workload in use.
# Limitations: this is an approximation, not Apple's private memory-pressure
#   score; field names can change across macOS releases.
# This recipe uses a shell pipeline, so doctor will not identify one command
#   to check safely.

[item.memory_pressure]
type = "command"
run = "vm_stat | awk '/Pages free/{free=$3} /Pages active/{active=$3} /Pages inactive/{inactive=$3} /Pages speculative/{spec=$3} /Pages wired down/{wired=$4} END{gsub(/\\./,\"\",free); gsub(/\\./,\"\",active); gsub(/\\./,\"\",inactive); gsub(/\\./,\"\",spec); gsub(/\\./,\"\",wired); used=active+inactive+wired; total=used+free+spec; print int(used/total*100+0.5)}'"
interval = "1m"
format = "{output}% memory"
