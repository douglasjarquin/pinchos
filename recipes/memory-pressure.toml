# Recipe: Memory Use
# Category: System
# Expected output: "72%"
# This is a compact approximation from macOS VM page counts.

[item.memory]
run = "vm_stat | awk '/Pages free/{free=$3} /Pages active/{active=$3} /Pages inactive/{inactive=$3} /Pages speculative/{spec=$3} /Pages wired down/{wired=$4} END{gsub(/\\./,"",free); gsub(/\\./,"",active); gsub(/\\./,"",inactive); gsub(/\\./,"",spec); gsub(/\\./,"",wired); used=active+inactive+wired; total=used+free+spec; print int(used/total*100+0.5) "%"}'"
interval = "1m"
symbol = "memorychip"
