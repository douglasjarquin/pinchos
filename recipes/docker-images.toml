# Recipe: docker-images (optional third-party tool)
# Category: Development
#
# Purpose: show the number of unique Docker images stored locally.
# Dependencies: Docker Desktop or another Docker engine (`docker`).
# Expected output: "18" for eighteen unique image IDs.
# Limitations: the count reflects local cache state and does not include
#   remote registries; an unavailable engine leaves the last good value.

[item.docker_images]
type = "command"
run = "docker images -q | sort -u | wc -l | tr -d ' '"
interval = "10m"
timeout = "10s"
format = "images {output}"
on_error = "keep_last"
stale_after = "30m"
