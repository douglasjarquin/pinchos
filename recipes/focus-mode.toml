# Recipe: focus-mode
# Category: Desktop
#
# Purpose: show the Control Center visibility flag for Focus modes.
# Dependencies: none beyond `defaults`, which ships with macOS.
# Expected output: the stored Boolean or "unknown" when the preference is
#   absent on this macOS version.
# Limitations: this reads a private UI preference and is a best-effort hint,
#   not an authoritative Focus API. It can change across macOS releases.

[item.focus]

run = "defaults read com.apple.controlcenter 'NSStatusItem Visible FocusModes' 2>/dev/null || echo unknown"
interval = "1m"
format = "focus {output}"
