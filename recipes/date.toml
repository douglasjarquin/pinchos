# Recipe: date
# Category: Time
#
# Purpose: show today's local calendar date in the menu bar.
# Dependencies: none beyond the macOS base system (/bin/date).
# Expected output: "2026-08-30" in ISO calendar format.
#   The value is local-date and timezone-dependent.
# Limitations: this is a display-only date; it does not account for a
#   user's locale calendar or workday settings.
#
# Copy this file's [item.date] table into your pinchos.toml, then:
#   .build/release/pinchos validate
#   .build/release/pinchos run date

[item.date]
type = "command"
run = "date '+%Y-%m-%d'"
interval = "1m"
format = "{output}"
