# Recipe: brew-outdated (optional third-party tool)
# Category: Development
#
# Purpose: show how many Homebrew formulae and casks report updates.
# Dependencies: Homebrew (`brew`), install from https://brew.sh/.
# Expected output: "4" for four outdated packages.
# Limitations: this is account-, tap-, and network-dependent; `brew update`
#   may be needed before the count reflects current package metadata.

[item.brew_outdated]

run = "brew outdated --quiet | wc -l | tr -d ' '"
interval = "30m"
timeout = "30s"
format = "brew {output} outdated"
