# Recipe: public-ip (network)
# Category: Network
#
# Purpose: show the public IPv4 address seen by a simple external service.
# Dependencies: `curl`, which ships with macOS, plus network access.
# Expected output: "203.0.113.42"-shaped text from api.ipify.org.
# Limitations: the value is provider-, network-, and VPN-dependent; the
#   example service is external and can be unavailable. Replace it with a
#   service you trust before relying on it operationally.

[item.public_ip]

run = "curl -fsS --max-time 5 https://api.ipify.org"
interval = "10m"
timeout = "8s"
format = "WAN {output}"
