# Recipe: github-status (optional third-party tool)
# Category: GitHub
#
# Purpose: show your unread GitHub notification count in the menu bar.
# Dependencies: the GitHub CLI (`gh`), which does not ship with macOS.
#   Source / install: https://cli.github.com/ (Homebrew: `brew install gh`).
# Account/auth requirement: `gh` must already be authenticated
#   (`gh auth login`, using its own stored keychain/token) before `run`
#   below will succeed. No token or account identifier is stored in this
#   file; `gh` resolves its own already-configured session.
#
# Expected output: "3" (an integer count of unread notifications across
#   every repository you can see, via `GET /notifications`). Account- and
#   network-dependent: it reflects your GitHub account's current inbox,
#   not any fixed repository.
# Limitations: `gh api notifications` paginates at 50 items per page by
#   default and this recipe counts only the first page, so a very large
#   unread count is reported as "50", not the true total. `gh` will print
#   an authentication error to stderr and exit non-zero when not logged
#   in; with `on_error = "keep_last"` below, the item then keeps showing
#   its last successful count instead of flashing `error_text`.
#   `--jq` is `gh`'s own built-in JSON filter flag, so this is a single
#   command with no shell pipeline, and `pinchos doctor` can check that
#   `gh` is on PATH.
#
# Copy this file's [item.*] table(s) into your pinchos.toml, run
# `gh auth login` if you have not already, then:
#   .build/release/pinchos validate
#   .build/release/pinchos doctor
#   .build/release/pinchos run github_notifications

[item.github_notifications]
type = "command"
run = "gh api notifications --jq 'length'"
interval = "5m"
timeout = "15s"
format = "🔔 {output}"
error_text = "–"
on_error = "keep_last"
stale_after = "30m"
