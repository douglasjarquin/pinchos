# Recipe: dns-server
# Category: Network
#
# Purpose: show the first DNS nameserver currently advertised to macOS.
# Dependencies: none beyond the macOS base system (/usr/sbin/scutil and awk).
# Expected output: "192.168.1.1" or another resolver from the active setup.
# Limitations: the first resolver is not necessarily the one that answers a
#   particular query; an empty result means macOS has no parsed nameserver.

[item.dns]
type = "command"
run = "scutil --dns | awk '/nameserver\\[[0-9]+\\]/{print $3; exit}'"
interval = "5m"
format = "DNS {output}"
