# Recipe: audio-muted
# Category: Desktop
#
# Purpose: show whether macOS has muted the default audio output.
# Dependencies: none beyond macOS scripting support (`osascript`).
# Expected output: "true" or "false".
# Limitations: the result describes the system output mute flag, not whether
#   a specific application is silent.

[item.muted]
type = "command"
run = "osascript -e 'output muted of (get volume settings)'"
interval = "30s"
format = "muted {output}"
