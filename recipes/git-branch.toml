# Recipe: git-branch (optional path configuration)
# Category: Development
#
# Purpose: show the current branch for a repository you actively work in.
# Dependencies: Git, which ships with Xcode Command Line Tools.
# Configuration: replace `/path/to/repository` in `REPO_PATH` below.
# Expected output: "main" or the branch currently checked out.
# Limitations: detached HEAD and a missing path produce an error; the recipe
#   does not guess which repository is intended from Pinchos' config folder.

[item.branch]

run = "git -C \"/path/to/repository\" branch --show-current"
interval = "1m"
format = "{output}"
