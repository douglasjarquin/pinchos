# Recipe: audio-volume
# Category: Desktop
#
# Purpose: show the current system output volume percentage.
# Dependencies: none beyond macOS scripting support (`osascript`).
# Expected output: "65" for a system volume set to 65 percent.
# Limitations: this is the default output volume, not per-application volume;
#   macOS permissions or audio-device changes can affect availability.

[item.volume]
type = "command"
run = "osascript -e 'output volume of (get volume settings)'"
interval = "30s"
format = "volume {output}%"
