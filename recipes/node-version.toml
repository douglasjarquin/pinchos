# Recipe: node-version (optional third-party tool)
# Category: Development
#
# Purpose: show the active Node.js version on the machine.
# Dependencies: Node.js, install from https://nodejs.org/ or a version
#   manager such as Mise.
# Expected output: "v24.5.0" or the installed version.
# Limitations: PATH selection determines which Node installation is shown;
#   this does not inspect project-local version files.

[item.node]
type = "command"
run = "node --version"
interval = "30m"
format = "node {output}"
