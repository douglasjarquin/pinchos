# Recipe: cpu-cores
# Category: System
#
# Purpose: show the number of logical CPU cores available to the system.
# Dependencies: none beyond the macOS base system (/usr/sbin/sysctl).
# Expected output: "10" or another machine-specific integer.
# Limitations: this is capacity, not current CPU utilization; the value can
#   differ from performance-core and efficiency-core counts.

[item.cores]
type = "command"
run = "sysctl -n hw.ncpu"
interval = "30m"
format = "{output} cores"
