# Recipe: network-latency
# Category: Network
#
# Purpose: show round-trip ICMP latency to a host, as a quick "is the
# network slow right now" signal.
# Dependencies: none beyond the macOS base system (/sbin/ping).
#
# Network recipe: `https://example.com` (used here as `example.com`, ICMP
# has no scheme) is a placeholder. IANA reserves example.com/.net/.org for
# documentation and it answers ICMP echo requests, but it is not a
# commitment of latency, uptime, or ICMP policy for your use case — replace
# it with a host you actually care about reaching (e.g. your router, VPN
# gateway, or a service you operate).
#
# Expected output: "7.32" (round-trip average in milliseconds, one decimal
#   place as reported by `ping`), or "unreachable" if the host does not
#   resolve or does not answer within the bound below.
#   Network-, host-, and route-dependent by design — that is the point of
#   the recipe.
# Limitations: `ping -t 2` bounds the ping itself to 2 seconds; the item's
#   own `timeout = "5s"` is a second, independent bound in case `ping`
#   itself hangs (e.g. slow DNS resolution before the first packet is
#   sent). Redirecting `ping`'s stderr to /dev/null means a DNS failure is
#   silent; the trailing `awk` fallback below turns "no round-trip line
#   at all" into the literal string "unreachable" so the item always shows
#   a value instead of blanking out. This recipe is not exercised in CI
#   (no network there); it is syntax-checked only.
# This recipe uses a shell pipeline (`|`), so `pinchos doctor` reports that
# it "could not identify a single command to check safely" for this item's
# `run` line — that is expected, not a bug.
#
# Copy this file's [item.*] table(s) into your pinchos.toml, replace the
# host, then:
#   .build/release/pinchos validate
#   .build/release/pinchos run latency

[item.latency]
type = "command"
run = "ping -c 1 -t 2 example.com 2>/dev/null | tail -1 | awk -F'/' '{avg=$5} END{print (avg==\"\" ? \"unreachable\" : avg)}'"
interval = "1m"
timeout = "5s"
on_error = "keep_last"
stale_after = "10m"
