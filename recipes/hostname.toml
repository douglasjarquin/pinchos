# Recipe: hostname
# Category: System
#
# Purpose: show the short hostname of the Mac running Pinchos.
# Dependencies: none beyond the macOS base system (/bin/hostname).
# Expected output: "macbook-pro" or another machine-specific short name.
# Limitations: the name follows local network and system settings and can
#   change when the computer is renamed.

[item.hostname]

run = "hostname -s"
interval = "10m"
format = "{output}"
