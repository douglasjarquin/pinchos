# Recipe: github-open-issues (optional third-party tool)
# Category: GitHub
#
# Purpose: show the number of open issues visible in the GitHub CLI context.
# Dependencies: the GitHub CLI (`gh`), install from https://cli.github.com/.
#   Authenticate with `gh auth login`; no token belongs in this file.
# Expected output: "12" for twelve open issues.
# Limitations: `gh issue list` uses the current repository context; add
#   `--repo owner/name` when you want a fixed repository from any directory.

[item.github_open_issues]

run = "gh issue list --state open --limit 100 --json number --jq 'length'"
interval = "5m"
timeout = "15s"
format = "issues {output}"
