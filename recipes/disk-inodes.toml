# Recipe: disk-inodes
# Category: System
#
# Purpose: show the percentage of root-volume inodes in use.
# Dependencies: none beyond the macOS base system (/bin/df and awk).
# Expected output: "12%" or another machine-specific percentage.
# Limitations: APFS storage pressure is usually byte-based; inode pressure
#   is a separate diagnostic and can be less useful on normal Macs.

[item.disk_inodes]
type = "command"
run = "df -Pi / | awk 'NR==2{print $5}'"
interval = "10m"
format = "inodes {output}"
