# Recipe: docker-containers (optional third-party tool)
# Category: Development
#
# Purpose: show the number of currently running Docker containers.
# Dependencies: Docker Desktop or another Docker engine (`docker`).
# Expected output: "5" for five running containers.
# Limitations: a stopped Docker daemon makes the command fail; this counts
#   only running containers, not exited containers or Kubernetes workloads.

[item.docker_containers]
type = "command"
run = "docker ps -q | wc -l | tr -d ' '"
interval = "1m"
timeout = "10s"
format = "docker {output} running"
on_error = "keep_last"
stale_after = "15m"
