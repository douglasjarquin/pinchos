# Recipe: top-process
# Category: System
#
# Purpose: show the executable currently using the most CPU in a quick
#   process snapshot.
# Dependencies: none beyond the macOS base system (/bin/ps, sort, head,
#   and awk).
# Expected output: "WindowServer" or another active process name.
# Limitations: this is a single sampled ranking and can change rapidly;
#   process names containing spaces are reduced to their first token.

[item.top_process]

run = "ps -Ao comm=,pcpu= | sort -k2 -nr | head -1 | awk '{print $1}'"
interval = "30s"
format = "CPU {output}"
