# Recipe: weekday
# Category: Time
#
# Purpose: show the current local weekday, useful when a compact bar item
#   should answer "what day is it" without opening a calendar.
# Dependencies: none beyond the macOS base system (/bin/date).
# Expected output: "Sunday" in the machine's current locale.
#   The value is locale-, date-, and timezone-dependent.
# Limitations: the result follows the locale configured for the shell that
#   launches Pinchos, so it may not be English on every machine.

[item.weekday]
type = "command"
run = "date '+%A'"
interval = "5m"
format = "{output}"
