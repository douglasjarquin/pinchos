# Recipe: brew-services (optional third-party tool)
# Category: Development
#
# Purpose: show how many Homebrew services are currently running.
# Dependencies: Homebrew (`brew`), install from https://brew.sh/.
# Expected output: "3" for three services whose status is not `none`.
# Limitations: service labels and status columns can change across Homebrew
#   releases; this is a local snapshot and does not inspect child health.

[item.brew_services]
type = "command"
run = "brew services list | awk 'NR>1 && $2 != \"none\" {count++} END{print count+0}'"
interval = "5m"
timeout = "15s"
format = "services {output}"
on_error = "keep_last"
