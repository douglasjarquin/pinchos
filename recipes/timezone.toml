# Recipe: timezone
# Category: Time
#
# Purpose: show the local timezone abbreviation and numeric offset.
# Dependencies: none beyond the macOS base system (/bin/date).
# Expected output: "EDT -0400" or the current local equivalent.
# Limitations: daylight-saving changes alter the value; this is the system
#   timezone, not necessarily a remote service's timezone.

[item.timezone]
type = "command"
run = "date '+%Z %z'"
interval = "10m"
format = "{output}"
