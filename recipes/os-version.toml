# Recipe: os-version
# Category: System
#
# Purpose: show the installed macOS product version.
# Dependencies: none beyond the macOS base system (/usr/bin/sw_vers).
# Expected output: "15.6.1" or the version installed on this Mac.
# Limitations: this reports the product version only, not whether a reboot
#   is required after an update.

[item.macos]
type = "command"
run = "sw_vers -productVersion"
interval = "30m"
format = "macOS {output}"
