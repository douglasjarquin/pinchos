# Recipe: git-status (optional path configuration)
# Category: Development
#
# Purpose: show how many changed paths are in a repository.
# Dependencies: Git, which ships with Xcode Command Line Tools.
# Configuration: replace `/path/to/repository` in `REPO_PATH` below.
# Expected output: "0" for a clean worktree or a count of modified,
#   untracked, and deleted paths.
# Limitations: the count is intentionally compact and does not classify the
#   changes; submodules are reported as one path.
# This recipe uses a shell pipeline, so doctor will not identify one command
#   to check safely.

[item.worktree]
type = "command"
run = "git -C \"$REPO_PATH\" status --porcelain=v1 | wc -l | tr -d ' '"
interval = "30s"
format = "changes {output}"
on_error = "keep_last"

[item.worktree.env]
REPO_PATH = "/path/to/repository"
