# Recipe: architecture
# Category: System
#
# Purpose: show the kernel-reported CPU architecture.
# Dependencies: none beyond the macOS base system (/usr/bin/uname).
# Expected output: "arm64" on Apple silicon or "x86_64" on an Intel Mac.
# Limitations: this describes the current process environment, which can be
#   affected by Rosetta when a process is launched under translation.

[item.architecture]

run = "uname -m"
interval = "30m"
format = "{output}"
