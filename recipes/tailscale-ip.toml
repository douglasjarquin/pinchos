# Recipe: tailscale-ip (optional third-party tool)
# Category: Network
#
# Purpose: show the IPv4 address assigned by Tailscale when its tunnel is up.
# Dependencies: Tailscale CLI, install from https://tailscale.com/download.
# Expected output: a 100.x.y.z address while signed in and connected.
# Limitations: the command fails when Tailscale is stopped or signed out;
#   that is intentionally kept as the last good value by this recipe.

[item.tailscale]

run = "tailscale ip -4"
interval = "1m"
timeout = "10s"
format = "TS {output}"
